[server]
host = "127.0.0.1"
port = 8002
endpoint = "http://localhost:8002"

[cors]
allowed_origins = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "https://openagenet.github.io",
  "https://openagenet.github.io/oan-site",
]

[node]
name = "Discovery Node"
role = "discovery"
did_semantic_code = "AGDS"

[upstream]
root_endpoint = "http://localhost:8000"
cdn_endpoint = "http://localhost:8003"

[paths]
data_dir = "../../data/discovery"
index_dir = "../../data/discovery/index"
database_url = "postgres://postgres:postgres@127.0.0.1:5432/oan_discovery"
keys_dir = "../../data/discovery/keys"

[semanticSearch]
enabled = false
engine = "pgvector"
fallback = "keyword"
defaultMode = "hybrid"
candidateMultiplier = 8
maxCandidates = 500
explainEnabled = true

[semanticSearch.embedding]
provider = "deterministic-local"
modelName = "oan-deterministic-local-v1"
dimension = 64
timeoutMs = 2000
batchSize = 32
maxInputChars = 6000

# Production semantic discovery can use services/embedding-service as an
# internal HTTP embedding service. Keep modelVersion stable while an index is
# active; changing it requires rebuilding the semantic index.
# provider = "http-embedding"
# endpoint = "http://127.0.0.1:18080/embed"
# healthEndpoint = "http://127.0.0.1:18080/health"
# modelName = "gte-multilingual-base"
# modelVersion = "gte-multilingual-base-q8-local"
# strictModelVersion = true
# dtype = "q8"
# dimension = 768

# Matching embedding-service environment for the first production profile:
# OAN_EMBEDDING_PROVIDER=transformers
# OAN_EMBEDDING_MODEL=gte-multilingual-base
# OAN_EMBEDDING_MODEL_ID=/opt/oan/models/onnx-community/gte-multilingual-base
# OAN_EMBEDDING_LOCAL_MODEL_PATH=/opt/oan/models/onnx-community
# OAN_EMBEDDING_VERSION=gte-multilingual-base-q8-local
# OAN_EMBEDDING_DIMENSION=768
# OAN_EMBEDDING_DTYPE=q8

[semanticSearch.filters]
resourceType = "hard"
capabilityTags = "hard"
protocol = "hard"
